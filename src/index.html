<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cMusic</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div id="app">
    <!-- ══ Rail esquerdo (ícones) ══════════════════════ -->
    <aside id="rail">
      <button id="rail-toggle" title="Expandir sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <nav id="nav">
        <button class="nav-item active" data-view="home" title="Início">
          <svg class="nav-ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3 4 9v12h5v-7h6v7h5V9z"/></svg>
          <span class="nav-label">Início</span>
        </button>
        <button class="nav-item" data-view="related" title="Similares">
          <svg class="nav-ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor" stroke="none"/></svg>
          <span class="nav-label">Similares</span>
        </button>
        <button class="nav-item" data-view="albums" title="Álbuns">
          <svg class="nav-ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.5 2 2 5.6 2 10v4c0 4.4 4.5 8 10 8s10-3.6 10-8v-4c0-4.4-4.5-8-10-8m0 4.5A3.5 3.5 0 1 1 8.5 10 3.5 3.5 0 0 1 12 6.5"/></svg>
          <span class="nav-label">Álbuns</span>
        </button>
        <button class="nav-item" data-view="playlists" title="Playlists">
          <svg class="nav-ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 6h12v2H3zM3 10h12v2H3zm0 4h8v2H3zm14 0v-2h-2v2h-2v2h2v2h2v-2h2v-2z"/></svg>
          <span class="nav-label">Playlists</span>
        </button>
        <button class="nav-item" data-view="favorites" title="Favoritas">
          <svg class="nav-ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
          <span class="nav-label">Favoritas</span>
        </button>
        <button class="nav-item" data-view="profile" title="Perfil">
          <svg class="nav-ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5z"/></svg>
          <span class="nav-label">Perfil</span>
        </button>
      </nav>
      <div id="rail-footer">
        <span id="rail-version">v…</span>
        <a class="rail-link" href="https://github.com/contrasov/cMusic" target="_blank" title="Repositório (GitHub)">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </aside>

    <!-- ══ Coluna central ═════════════════════════════ -->
    <div id="main-col">
      <header id="header">
        <div id="header-left">
          <button id="btn-back" class="hidden" title="Voltar">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
          </button>
          <div id="header-title">Início</div>
        </div>
        <div id="header-right">
          <form id="search-form">
            <input id="search-input" type="search" placeholder="Buscar..." autocomplete="off" />
            <button type="submit" aria-label="Buscar">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
            </button>
          </form>
        </div>
      </header>
      <main id="content"><div id="view"></div></main>
    </div>

    <!-- ══ Fila (direita) ═════════════════════════════ -->
    <aside id="queue">
      <h2>
        Fila
        <span id="queue-actions">
          <button class="q-action" id="btn-clear-queue" title="Limpar fila">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M18.5 2.5a1.5 1.5 0 0 1 2.12 2.12l-1.24 1.25L22 8.5a1.5 1.5 0 0 1 0 2.12l-4.25-4.24-2.31 2.3a9.5 9.5 0 0 1-2.6 8.67 6 6 0 0 1-8.49 0 6 6 0 0 1 0-8.48 9.5 9.5 0 0 1 8.68-2.61l2.3-2.31z"/></svg>
          </button>
          <button class="q-action" id="btn-queue-min" title="Ocultar fila">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M9.8 12 14.4 7.4 13 6l-6 6 6 6 1.4-1.4zm6.4 0 4.6-4.6L19.4 6l-6 6 6 6 1.4-1.4z"/></svg>
          </button>
        </span>
      </h2>
      <div id="queue-empty" class="empty">Toque algo para montar a fila</div>
      <ul id="queue-list"></ul>
    </aside>
  </div>

  <!-- ══ Dynamic Island (só com música) ═══════════════ -->
  <footer id="island" class="hidden">
    <audio id="audio" preload="auto"></audio>

    <div id="np-info">
      <img id="np-thumb" src="" alt="" />
      <div id="np-fallback" class="hidden">♪</div>
      <div class="np-text">
        <div id="np-title">Nada tocando</div>
        <div id="np-artist">cMusic</div>
      </div>
      <button class="np-btn" id="btn-fav" title="Favoritar">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
      </button>
    </div>

    <div id="np-controls">
      <button class="np-btn" id="btn-shuffle" title="Aleatório">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z"/></svg>
      </button>
      <button class="np-btn" id="btn-prev" title="Anterior">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="np-btn np-main" id="btn-play" title="Tocar/Pausar">
        <svg id="icon-play" viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" class="hidden"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
        <span class="np-spinner" aria-hidden="true"></span>
      </button>
      <button class="np-btn" id="btn-next" title="Próxima">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
      </button>
      <button class="np-btn" id="btn-repeat" title="Repetir">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M7 7h10v3l-4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
      </button>
    </div>

    <div id="np-seek">
      <span id="time-cur">0:00</span>
      <input id="seekbar" type="range" min="0" max="100" value="0" step="0.1" />
      <span id="time-total">0:00</span>
    </div>

    <div id="np-vol">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input id="volumebar" type="range" min="0" max="100" value="100" />
    </div>

    <button class="np-btn" id="btn-queue" title="Mostrar fila">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
    </button>
  </footer>

  <div id="toast" class="hidden"></div>
  <div id="np-full" class="hidden"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
